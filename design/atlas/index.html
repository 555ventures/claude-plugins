<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design atlas</title>
<style>
/* Chrome token register — spec/doctrine/design.md § Design Atlas (D4/D5, specs/20260902/09).
   shadcn's Neutral theme as plain CSS custom properties, plus the full register every
   chrome page (atlas, galleries, preview toolbar, sketch workbench, notes layer) inlines and
   consumes — never a literal color outside this `:root` block. `design-atlas.js`'s `page()`
   reads this file once per process and inlines it before its own rules; every chrome rule
   below is written on `var(--v-*)` roles only. The flat register a wireframe links
   (`wire-tokens.css`/`wire.css`) is separately owned and is not value-equal: chrome answers to
   design/chrome-mocks/ (specs/20260912/05-07), the wireframe register answers to shadcn
   (docs/adr/0017-the-register-is-the-whole-shadcn-set.md). Plain CSS, no build step, no
   preprocessor.
   `:host` is listed beside `:root` so the same register resolves inside a shadow tree: the notes
   layer (lib/notes-layer.browser.js) links this file INSIDE its shadow roots, never into a served
   mock's document — the `body`/`*` rules below are chrome-page rules and must never reach a
   mock's cascade (tests/mocks/notes-layer-isolation.test.js pins that a served mock computes the
   same styles with and without the layer). */

:host,:root{
  --v-bg:#ffffff; --v-fg:#0a0a0a; --v-muted:#737373; --v-muted-bg:#f5f5f5; --v-border:#e5e5e5;
  --v-primary:#171717; --v-primary-fg:#fafafa; --v-ring:#a3a3a3; --v-accent:#f5f5f5;
  --v-danger:#dc2626; --v-warn:#d97706; --v-ok:#16a34a;
  --v-radius:8px; --v-space-1:4px; --v-space-2:8px; --v-space-3:12px; --v-space-4:16px; --v-space-6:24px;
  --v-font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Inter,Roboto,sans-serif;
  --v-shadow:0 1px 2px rgba(0,0,0,.05),0 4px 12px rgba(0,0,0,.06);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--v-bg);
  color: var(--v-fg);
  font-family: var(--v-font);
}

/* .v-card — the base card surface: 1px border, soft shadow, rounded corners */
.v-card {
  background: var(--v-bg);
  color: var(--v-fg);
  border: 1px solid var(--v-border);
  border-radius: var(--v-radius);
  box-shadow: var(--v-shadow);
  padding: var(--v-space-4);
}

/* .v-btn — ghost by default; .primary is the one filled button */
.v-btn {
  display: inline-flex;
  align-items: center;
  gap: var(--v-space-2);
  border: 1px solid var(--v-border);
  border-radius: var(--v-radius);
  background: var(--v-bg);
  color: var(--v-fg);
  padding: var(--v-space-2) var(--v-space-3);
  font: inherit;
  cursor: pointer;
}
.v-btn.primary {
  border-color: var(--v-primary);
  background: var(--v-primary);
  color: var(--v-primary-fg);
}
.v-btn.ghost {
  border-color: transparent;
  background: transparent;
}
.v-btn:focus-visible {
  outline: 2px solid var(--v-ring);
  outline-offset: 1px;
}

/* .v-badge — status chip base, tinted only through roles */
.v-badge {
  display: inline-flex;
  align-items: center;
  gap: var(--v-space-1);
  border: 1px solid var(--v-border);
  border-radius: var(--v-radius);
  background: var(--v-muted-bg);
  color: var(--v-muted);
  padding: 2px var(--v-space-2);
  font-size: 0.8em;
}

.v-input {
  border: 1px solid var(--v-border);
  border-radius: var(--v-radius);
  background: var(--v-bg);
  color: var(--v-fg);
  padding: var(--v-space-2) var(--v-space-3);
  font: inherit;
}
.v-input:focus-visible {
  outline: 2px solid var(--v-ring);
  outline-offset: 1px;
}

/* .v-bar — the atlas/toolbar chrome bar */
.v-bar {
  display: flex;
  align-items: center;
  gap: var(--v-space-3);
  background: var(--v-bg);
  border-bottom: 1px solid var(--v-border);
  padding: var(--v-space-3) var(--v-space-4);
}

/* .v-chip — the journey-status badge register: gap/sketch/ratified/approved/bound/built/orphan */
.v-chip {
  display: inline-flex;
  align-items: center;
  gap: var(--v-space-1);
  border-radius: var(--v-radius);
  padding: 2px var(--v-space-2);
  font-size: 0.8em;
  border: 1px solid var(--v-border);
  background: var(--v-muted-bg);
  color: var(--v-muted);
}
.v-chip.gap { border-color: var(--v-danger); color: var(--v-danger); background: var(--v-bg); }
.v-chip.sketch { border-color: var(--v-muted); color: var(--v-muted); background: var(--v-muted-bg); }
.v-chip.ratified { border-color: var(--v-warn); color: var(--v-warn); background: var(--v-bg); }
.v-chip.approved { border-color: var(--v-ok); color: var(--v-ok); background: var(--v-bg); }
.v-chip.bound { border-color: var(--v-primary); color: var(--v-primary); background: var(--v-bg); }
.v-chip.built { border-color: var(--v-ok); color: var(--v-primary-fg); background: var(--v-ok); }
.v-chip.orphan { border-color: var(--v-danger); color: var(--v-primary-fg); background: var(--v-danger); }

/* Gallery cards — the atlas/gallery grid item wrapping a rendered mock */
.v-gallery-card {
  background: var(--v-bg);
  border: 1px solid var(--v-border);
  border-radius: var(--v-radius);
  box-shadow: var(--v-shadow);
  overflow: hidden;
}
.v-gallery-card .v-bar { border-bottom: 1px solid var(--v-border); }

/* Lightbox — backdrop derived from --v-fg at 85%, never a literal color */
.v-lightbox-backdrop {
  position: fixed;
  inset: 0;
  background: color-mix(in srgb, var(--v-fg) 85%, transparent);
}

/* Matrix toolbar — theme/viewport switches for the atlas review surface */
.v-matrix-toolbar {
  display: flex;
  align-items: center;
  gap: var(--v-space-2);
  background: var(--v-muted-bg);
  border: 1px solid var(--v-border);
  border-radius: var(--v-radius);
  padding: var(--v-space-2) var(--v-space-3);
}

/* The mock-page scope toggle (.nl-scope) — specs/20260906/03-questions-on-the-wireframe.md D5.
   Reads as .v-badge does; the selected state borrows the one filled-button treatment
   (.v-btn.primary) rather than inventing a new fill. */
.nl-scope {
  display: inline-flex;
  border: 1px solid var(--v-border);
  border-radius: var(--v-radius);
  overflow: hidden;
}
.nl-scope button {
  border: 0;
  background: var(--v-bg);
  color: var(--v-fg);
  padding: var(--v-space-2) var(--v-space-3);
  font: inherit;
  font-size: 14px;
  cursor: pointer;
}
.nl-scope-on {
  background: var(--v-primary);
  color: var(--v-primary-fg);
}

/* Note-anchor chrome (.nl-anchor/.nl-up) — specs/20260907/09-atlas-index-and-note-navigation.md
   D7/D9/D10, updated by specs/20260913/06-every-mock-has-a-page-you-can-mark.md D5. A
   mock-scope note in the project panel replaces its plain `<b>` id badge with this pill: an
   `a.nl-anchor` when the note's screen is drawn on the served atlas (linking to that screen's
   own page, `/screen/<screen>.html`), or an inert `span.nl-anchor.plain` when the screen has no
   card. `.nl-up` is the strip heading's link back to the atlas's project panel. Every color is
   an existing --v-* role — no new token, no literal. */
.nl-anchor {
  display: inline-flex;
  align-items: center;
  border: 0;
  border-radius: 999px;
  padding: 2px var(--v-space-3);
  font-size: 12px;
  color: var(--v-fg);
  background: var(--v-muted-bg);
  cursor: pointer;
}
.nl-anchor:hover {
  background: var(--v-muted-bg);
}
.nl-anchor.plain {
  color: var(--v-muted);
  cursor: default;
}
.nl-anchor.plain:hover {
  background: var(--v-muted-bg);
}
.nl-up {
  font-size: 12px;
  color: var(--v-muted);
  text-decoration: none;
}
.nl-up:hover {
  color: var(--v-fg);
  text-decoration: underline;
}

/* Journey review page (.rv-*) — specs/20260906/04-journey-review-page.md D4/D5, chrome rule in
   spec/doctrine/design.md § Design Canon. Three panes on a 48px bar: rail · dotted canvas of
   artboards · inspector; the inspector folds to a 44px strip. Every color is an existing --v-*
   role (open doubt = --v-warn, confirmed = --v-ok, corrected = --v-primary) — no new token, no
   literal; tints are color-mix over the roles. The wireframe inside a frame stays gray: nothing
   here reaches an iframe's document. Phone (≤480): the rail collapses to its <select>, the
   inspector becomes a bottom sheet — same DOM, CSS only. */
.rv [hidden] { display: none !important; }
.rv { --rv-bar: 48px; --rv-rail: 220px; --rv-pane: 360px; --rv-strip: 44px; font-size: 13px; line-height: 1.45; min-height: 100vh; display: flex; flex-direction: column; }
.rv .rv-n { font-variant-numeric: tabular-nums; color: var(--v-muted); margin-right: var(--v-space-2); }
.rv kbd { display: inline-block; min-width: 1.5em; padding: 0 5px; border: 1px solid var(--v-border); border-bottom-width: 2px; border-radius: 4px; background: var(--v-muted-bg); color: var(--v-fg); font: 600 11px/1.6 var(--v-font); text-align: center; }
.rv button { font: inherit; color: var(--v-fg); background: var(--v-bg); border: 1px solid var(--v-border); border-radius: var(--v-radius); padding: 4px 10px; cursor: pointer; }
.rv button:hover:not(.rv-primary):not([aria-selected="true"]) { background: var(--v-muted-bg); }
.rv button:focus-visible, .rv a:focus-visible, .rv textarea:focus-visible, .rv select:focus-visible, .rv [tabindex]:focus-visible { outline: 2px solid var(--v-ring); outline-offset: 1px; }
.rv button[disabled] { opacity: .5; cursor: not-allowed; }
.rv .rv-primary { background: var(--v-primary); color: var(--v-primary-fg); border-color: var(--v-primary); }
.rv .rv-primary:hover { background: color-mix(in srgb, var(--v-primary) 88%, var(--v-bg)); }
.rv textarea { width: 100%; font: inherit; color: var(--v-fg); background: var(--v-bg); border: 1px solid var(--v-border); border-radius: var(--v-radius); padding: 6px 8px; resize: vertical; }
.rv .rv-sep { color: var(--v-muted); margin: 0 6px; }

/* bar */
.rv-bar { position: sticky; top: 0; z-index: 5; height: var(--rv-bar); display: flex; align-items: center; flex-wrap: nowrap; gap: var(--v-space-4); padding: 0 var(--v-space-4); background: var(--v-bg); border-bottom: 1px solid var(--v-border); }
.rv-bar > * { min-width: 0; }
.rv-bar button, .rv-bar a { white-space: nowrap; }
.rv-crumb { display: flex; align-items: center; white-space: nowrap; color: var(--v-muted); font-size: 15px; flex: none; }
.rv-crumb strong { color: var(--v-fg); font-weight: 600; }
/* The one way out of a journey, so it reads as a link at every width. */
.rv-home { color: var(--v-muted); text-decoration: none; }
.rv-home:hover { color: var(--v-fg); text-decoration: underline; }
.rv-pill { display: inline-flex; align-items: center; flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; gap: .45em; border: 0; border-radius: 0; padding: 0; font-size: 14px; color: var(--v-muted); white-space: nowrap; }
.rv-pill::before { content: ""; width: 6px; height: 6px; border-radius: 99px; background: var(--v-warn); flex: none; }
.rv-control { display: flex; align-items: center; gap: var(--v-space-2); flex: none; }
.rv-nostop { margin: 0; color: var(--v-muted); font-size: 14px; }
.rv-stop { display: flex; align-items: center; flex-wrap: nowrap; gap: var(--v-space-2); }
.rv-stop textarea { width: 14rem; min-height: 28px; height: 28px; padding: 3px 8px; resize: none; }
.rv-stop .decide-msg { color: var(--v-danger); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 14rem; }
/* specs/20260912/07-a-whole-product-note-blocks-the-sign-off.md D3: the enabled approve control's
   own line saying the sign-off still waits on a whole-product note — muted/warn register, no new
   token (--v-warn is the same "open doubt" accent .rv-count/.rv-badge already use). */
.rv-projwait { margin: 0; color: var(--v-warn); font-size: 13px; white-space: nowrap; }

/* panes */
.rv-main { flex: 1; display: grid; grid-template-columns: var(--rv-rail) minmax(0, 1fr) var(--rv-pane); min-height: 0; }
.rv-folded .rv-main { grid-template-columns: var(--rv-rail) minmax(0, 1fr) var(--rv-strip); }
/* specs/20260913/06-every-mock-has-a-page-you-can-mark.md D2: the screen page (.rv-screen) has
   no rail — one board plus the inspector, so its grid drops the rail column entirely rather than
   collapsing it to zero width. */
.rv-screen .rv-main { grid-template-columns: minmax(0, 1fr) var(--rv-pane); }
.rv-screen.rv-folded .rv-main { grid-template-columns: minmax(0, 1fr) var(--rv-strip); }
.rv-rail { border-right: 1px solid var(--v-border); background: var(--v-bg); padding: var(--v-space-6) var(--v-space-4); position: sticky; top: var(--rv-bar); height: calc(100vh - var(--rv-bar)); overflow: auto; }
.rv-rail h2 { margin: var(--v-space-3) 0 var(--v-space-2); font-size: 14px; font-weight: 600; color: var(--v-fg); }
.rv-list { list-style: none; margin: 0 0 var(--v-space-3); padding: 0; }
.rv-list a { display: flex; align-items: center; padding: 6px 8px; border-radius: var(--v-radius); color: var(--v-fg); font-size: 15px; text-decoration: none; }
.rv-list a:hover { background: var(--v-muted-bg); }
.rv-list a.rv-cur { background: var(--v-muted-bg); font-weight: 600; }
.rv-here { margin-left: auto; font-size: 12px; font-weight: 400; color: var(--v-muted); border: 0; border-radius: 0; padding: 0; }
.rv-count { margin-left: auto; min-width: 1.6em; text-align: center; border-radius: 999px; padding: 0 6px; font-size: 12px; font-variant-numeric: tabular-nums; background: color-mix(in srgb, var(--v-warn) 14%, var(--v-bg)); color: var(--v-warn); border: 1px solid color-mix(in srgb, var(--v-warn) 40%, var(--v-bg)); }
.rv-count[data-zero] { background: transparent; color: var(--v-muted); border-color: transparent; }
.rv-project { margin-top: calc(-1 * var(--v-space-2)); }
.rv-project a { color: var(--v-muted); }
.rv-project .rv-n { color: var(--v-muted); }
.rv-jump { display: none; width: 100%; font: inherit; padding: 6px 8px; border: 1px solid var(--v-border); border-radius: var(--v-radius); background: var(--v-bg); color: var(--v-fg); }

/* canvas + artboards */
.rv-canvas { padding: var(--v-space-6) 40px; background-color: var(--v-muted-bg); display: flex; flex-direction: column; gap: var(--v-space-6); min-width: 0; }
.rv-board { background: var(--v-bg); border: 1px solid var(--v-border); border-radius: calc(var(--v-radius) + 4px); box-shadow: var(--v-shadow); overflow: hidden; min-width: 0; scroll-margin-top: calc(var(--rv-bar) + var(--v-space-3)); }
.rv-board[data-focus] { border-color: var(--v-primary); box-shadow: 0 0 0 2px color-mix(in srgb, var(--v-primary) 25%, transparent), var(--v-shadow); }
.rv-cap { display: flex; align-items: center; flex-wrap: wrap; gap: var(--v-space-2) var(--v-space-4); padding: 10px var(--v-space-4); border-bottom: 1px solid var(--v-border); background: color-mix(in srgb, var(--v-muted-bg) 60%, var(--v-bg)); margin: 0; }
.rv-of { color: var(--v-muted); font-weight: 400; font-variant-numeric: tabular-nums; margin-left: .4em; }
.rv-cap h3 { margin: 0; font-size: 15px; font-weight: 600; }
.rv-vp { margin-left: auto; font-size: 13px; color: var(--v-muted); font-variant-numeric: tabular-nums; }
/* The stage: the ground a screen is seen against, which is what a mock needs instead of a bezel.
   The ~200px either side of a centred phone stops being empty white and becomes canvas. */
.rv-stage { background: var(--v-muted-bg); padding: var(--v-space-6) var(--v-space-4); }
.rv .rv-badge { min-width: 1.8em; padding: 0 6px; border-radius: 999px; font-size: 12px; font-variant-numeric: tabular-nums; background: color-mix(in srgb, var(--v-warn) 14%, var(--v-bg)); color: var(--v-warn); border-color: color-mix(in srgb, var(--v-warn) 40%, var(--v-bg)); }
.rv .rv-badge[data-zero] { background: transparent; color: var(--v-muted); border-color: transparent; }
.rv .rv-addnote { margin-left: 0; font-size: 14px; color: var(--v-muted); border-color: transparent; padding: 3px 9px; }
.rv .rv-addnote:hover { color: var(--v-fg); border-color: var(--v-border); }
/* D10: the per-board hide-marks eye — restated from design/chrome-mocks/review.html (missing here
   rendered as an unstyled default button, the emoji glyph at body-text size with no hit target). */
.rv .rv-pins { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; padding: 0; border-color: transparent; color: var(--v-muted); font-size: 15px; line-height: 1; }
.rv .rv-pins:hover { color: var(--v-fg); border-color: var(--v-border); }
.rv .rv-pins[aria-pressed="false"] { color: var(--v-fg); background: var(--v-muted-bg); border-color: var(--v-border); }
/* specs/20260912/12-the-loop-re-anchors-and-everyone-draws.md D11, disposed s2 (2026-09-13): the
   composer's ghost action, restated the same way, PLUS its own pressed state — mark mode had no
   visible signal on the review page at all once the framed mock's own bar went invisible. */
.rv .rv-mark-area { display: inline-flex; align-items: center; gap: .5em; color: var(--v-muted); border-color: transparent; margin-left: auto; }
.rv .rv-mark-area::before { content: ""; width: 11px; height: 8px; border: 1.5px dashed currentColor; border-radius: 2px; flex: none; }
.rv .rv-mark-area:hover { color: var(--v-fg); border-color: var(--v-border); }
.rv .rv-mark-area[aria-pressed="true"] { color: var(--v-primary-fg); background: var(--v-primary); border-color: var(--v-primary); }
.rv-tabs { display: flex; flex-wrap: wrap; gap: 2px 4px; border: 0; border-radius: 0; overflow: visible; flex-basis: 100%; margin: 2px 0 0 -4px; }
.rv-tabs button { border: 1px solid transparent; border-radius: 999px; padding: 3px 10px; font-size: 13px; color: var(--v-muted); background: transparent; }
.rv-tabs button:hover { background: var(--v-bg); border-color: var(--v-border); color: var(--v-fg); }
.rv-tabs button[aria-selected="true"] { background: var(--v-bg); color: var(--v-fg); border-color: var(--v-border); font-weight: 500; }
/* empty / loading / error are craft checks, not content states: a rule sets them apart. */
.rv-tabs button[data-gray-first] { margin-left: 6px; }
.rv-tabs button[data-gray-first]::before { content: ""; display: inline-block; width: 1px; height: 14px; background: var(--v-border); margin-right: 10px; vertical-align: -3px; }
/* D9: the per-state mark count riding the tab label — the same orange register the mark, the
   rail count and the caption badge all read as one system, restated verbatim from
   design/chrome-mocks/review.html's own copy (never present here before this pass). */
.rv-tabpin { display: inline-block; min-width: 1.5em; margin-left: 6px; padding: 0 5px; border-radius: 999px; font-size: 11px; line-height: 1.5; font-weight: 600; font-variant-numeric: tabular-nums; background: var(--v-warn); color: #fff; vertical-align: 1px; }
/* specs/20260912/12-the-loop-re-anchors-and-everyone-draws.md D3: the note id rides an orange
   pill on a region row and plain muted text on a row with no marked area — presence of the pill
   is the whole signal that clicking the row lands on a box. Restated from
   design/chrome-mocks/review.html, the binding artifact, whose own <style> block is the source.
   Without these the span renders unstyled and the id runs into the author name. */
.rv-pin { display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: 999px; background: var(--v-warn); color: #fff; font: 600 11.5px/1 var(--v-font); font-variant-numeric: tabular-nums; letter-spacing: .02em; white-space: nowrap; }
.rv-rowhead .rv-pin { margin-right: var(--v-space-2); }
/* D5: the pin's own background follows the row's turn, same register as the border above. */
.rv-row[data-turn="session"] .rv-pin { background: var(--v-danger); }
.rv-row[data-turn="you"] .rv-pin { background: var(--v-warn); }
.rv-row[data-turn="done"] .rv-pin { background: var(--v-ok); }
.rv-shot { --rv-scale: 1; position: relative; overflow: hidden; border: 0; background: transparent; height: calc(var(--rv-h) * var(--rv-scale) * 1px); }
.rv-shot::after {
  content: "";
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: calc(var(--rv-w) * var(--rv-scale) * 1px);
  height: calc(var(--rv-h) * var(--rv-scale) * 1px);
  border-radius: 4px;
  box-shadow: 0 0 0 1px var(--v-border), var(--v-shadow);
  pointer-events: none;
}
.rv-clean .rv-shot::after { display: none; }
/* specs/20260913/02-the-layer-owns-one-mode-and-the-page-owns-the-card.md D12: pointer-events
   stays auto on every board frame — scaled or clean — because a framed layer's own drag and box
   click (D2, D8) must reach it; nothing else lets a marked-up board be interactive at all. */
.rv-shot iframe { border: 0; display: block; transform-origin: 0 0; transform: scale(var(--rv-scale)); pointer-events: auto; }
.rv-clean .rv-shot { overflow: auto; height: auto; }
.rv-clean .rv-shot iframe { transform: none; }
.rv-clean .rv-addnote, .rv-clean .rv-badge { display: none; }

/* inspector */
.rv-inspector { border-left: 1px solid var(--v-border); background: var(--v-bg); position: sticky; top: var(--rv-bar); height: calc(100vh - var(--rv-bar)); display: flex; flex-direction: column; min-width: 0; }
.rv-filters { display: flex; align-items: center; flex-wrap: nowrap; gap: var(--v-space-1); height: 52px; padding: 0 var(--v-space-4); border-bottom: 1px solid var(--v-border); }
.rv-filters button { white-space: nowrap; flex: none; }
/* specs/20260912/12-the-loop-re-anchors-and-everyone-draws.md D15, disposed s3 (2026-09-13): the
   band said what it filters only in the mock's own single-letter fixture — `white-space:nowrap`
   plus `overflow:hidden` (structural, not fixture-clipped) truncated the real sentence mid-phrase
   at a realistic screen name and desktop width ("On screen results plus the whole … All screens").
   `flex-wrap:wrap` lets the sentence spill onto a second line instead of being cut; `min-height`
   (not a fixed `height`) lets the band grow to fit that second line rather than clipping it. */
.rv-scopeband { display: flex; align-items: center; flex-wrap: wrap; gap: .35em; min-height: 44px; padding: 8px var(--v-space-4); border-bottom: 1px solid var(--v-border); }
.rv-filters button { border-color: transparent; color: var(--v-muted); font-size: 14px; padding: 4px 9px; display: inline-flex; align-items: center; gap: 6px; }
.rv-filters button[aria-selected="true"] { background: var(--v-muted-bg); color: var(--v-fg); font-weight: 600; }
.rv-filters .rv-count { margin-left: 0; }
/* The label span carries the "Notes for" words as real DOM text, never CSS generated content (D4).
   `gap` on the band (above) is the one source of spacing now — no per-label margin, matching
   design/chrome-mocks/review.html's own rule, which carries none either. */
.rv-scopeband-label { color: var(--v-muted); font-weight: 400; }
/* specs/20260912/12-the-loop-re-anchors-and-everyone-draws.md D15, disposed s3 (2026-09-13): the
   band now wraps (above) rather than shrinking its labels to fit one line, so neither label needs
   the ellipsis treatment a prior pass gave the trailing one — a wrapped second line is readable in
   full, a mid-word ellipsis is not. The screen-name pill keeps its own overflow:hidden/ellipsis
   below for the pathological case of a single name too long for the band's own width; it is the
   only piece D15 ever sanctioned shrinking. */
.rv-screenfilter { display: inline-flex; align-items: center; max-width: 100%; min-width: 0; border-radius: 999px; background: var(--v-muted-bg); color: var(--v-fg); font-size: 13px; font-weight: 500; padding: 4px 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* D15: "All screens" — restated from design/chrome-mocks/review.html (missing here left the
   button flush against the sentence instead of pinned to the band's right edge). */
.rv .rv-allscreens { margin-left: auto; flex: none; border-color: transparent; color: var(--v-muted); font-size: 13px; padding: 3px 8px; }
.rv .rv-allscreens:hover { color: var(--v-fg); border-color: var(--v-border); }
.rv .rv-fold { margin-left: 0; flex: none; font-size: 16px; line-height: 1; padding: 0 6px; color: var(--v-muted); }
.rv-rows { flex: 1; overflow: auto; padding: var(--v-space-3) var(--v-space-4); }
.rv-row { border-left: 2px solid var(--v-border); padding: var(--v-space-2) var(--v-space-3); margin: 0 0 var(--v-space-2); border-radius: 0 var(--v-radius) var(--v-radius) 0; outline: 0; }
/* specs/20260913/05-a-note-is-a-conversation.md D5: the row's left border and its .rv-pin (the
   region note's id badge, below) are now keyed on data-turn, not data-status — a dropped note
   never renders a row at all (D4), so no rule exists for that turn. This reverses the chrome half
   of specs/20260912/12 D17 for the row and its pin only; the box half (.nl-region, above) stands. */
.rv-row[data-turn="session"] { border-left-color: var(--v-danger); }
.rv-row[data-turn="you"] { border-left-color: var(--v-warn); }
.rv-row[data-turn="done"] { border-left-color: var(--v-ok); }
.rv-row[data-selected] { background: var(--v-muted-bg); box-shadow: none; }
.rv-rowhead { display: flex; align-items: center; flex-wrap: wrap; gap: 2px; font-size: 14px; color: var(--v-muted); }
.rv-id { font-weight: 600; color: var(--v-fg); font-variant-numeric: tabular-nums; margin-right: var(--v-space-2); }
.rv-who { color: var(--v-muted); }
.rv-claim { margin: 4px 0 0; color: var(--v-fg); font-size: 15px; }
.rv-rejected { margin: 2px 0 0; font-size: 14px; color: var(--v-muted); }
.rv-wait { margin: 4px 0 0; font-size: 14px; color: var(--v-muted); }
.rv-answered { margin: 4px 0 0; font-size: 14px; color: var(--v-ok); }
.rv-chip { display: inline-flex; border: 0; border-radius: 999px; padding: 1px 9px; font-size: 12px; color: var(--v-muted); background: var(--v-muted-bg); margin-left: 6px; }
.rv-actions { display: flex; flex-wrap: wrap; align-items: center; gap: var(--v-space-1); margin-top: var(--v-space-2); }
.rv-actions button { font-size: 14px; padding: 4px 10px; }
/* specs/20260913/05-a-note-is-a-conversation.md D6: the row's own reply box, server-rendered
   hidden and unhidden by its row's Reply control — `.rv [hidden]` (above) is what hides it, so
   this only sets the shown shape. Keyed on the [data-rv] contract the Decision locks, not a class
   this file would otherwise have to coordinate with review-page.js's own naming. */
[data-rv="reply-box"] { display: flex; flex-direction: column; gap: var(--v-space-2); margin-top: var(--v-space-2); }
[data-rv="reply-text"] { min-height: 72px; }
.rv-empty { margin: var(--v-space-4) 0; color: var(--v-muted); font-size: 15px; }
.rv-composer { border-top: 1px solid var(--v-border); padding: var(--v-space-4); display: flex; flex-direction: column; gap: var(--v-space-3); }
.rv-composer textarea { min-height: 104px; }
.rv-composer .rv-actions { margin-top: 0; }
.rv-composer kbd { margin-left: 2px; }
.rv-keys { display: flex; flex-wrap: wrap; gap: var(--v-space-2) var(--v-space-3); padding: var(--v-space-3) var(--v-space-4); border-top: 1px solid var(--v-border); font-size: 12px; color: var(--v-muted); }
.rv .rv-keyhint { margin-left: auto; width: 24px; height: 24px; padding: 0; border-radius: 999px; border-color: transparent; color: var(--v-muted); font-size: 13px; line-height: 1; }
.rv .rv-keyhint[aria-expanded="true"] { background: var(--v-muted-bg); color: var(--v-fg); }
.rv-keys kbd { margin-right: 3px; }
.rv .rv-strip { position: sticky; top: var(--rv-bar); height: calc(100vh - var(--rv-bar)); width: var(--rv-strip); border: 0; border-left: 1px solid var(--v-border); border-radius: 0; padding: var(--v-space-3) 0; display: flex; flex-direction: column; align-items: center; gap: var(--v-space-3); }
.rv-strip-arrow { font-size: 16px; color: var(--v-muted); }
.rv-strip-count { writing-mode: vertical-rl; font-variant-numeric: tabular-nums; font-weight: 600; color: var(--v-warn); }

/* phone */
@media (max-width: 480px) {
  .rv-bar { height: auto; flex-wrap: wrap; padding: var(--v-space-2) var(--v-space-3); gap: var(--v-space-2); }
  .rv-control, .rv-stop { flex-wrap: wrap; width: 100%; }
  .rv-stop textarea { width: 100%; }
  .rv-main, .rv-folded .rv-main { grid-template-columns: minmax(0, 1fr); }
  .rv-rail { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--v-border); padding: var(--v-space-2) var(--v-space-3); }
  .rv-rail h2, .rv-list { display: none; }
  .rv-jump { display: block; }
  .rv-canvas { padding: var(--v-space-3); padding-bottom: 50vh; }
  .rv-inspector { position: fixed; left: 0; right: 0; bottom: 0; top: auto; height: 45vh; border-left: 0; border-top: 1px solid var(--v-border); border-radius: var(--v-radius) var(--v-radius) 0 0; box-shadow: 0 -4px 16px color-mix(in srgb, var(--v-fg) 8%, transparent); z-index: 6; }
  /* .rv is kept here too: the base rule above is now .rv .rv-strip (D9), so this override needs
     equal specificity to still win the cascade at this breakpoint. */
  .rv .rv-strip { position: fixed; left: 0; right: 0; bottom: 0; top: auto; width: auto; height: var(--rv-strip); flex-direction: row; justify-content: center; border-left: 0; border-top: 1px solid var(--v-border); padding: 0; z-index: 6; }
  .rv-strip-count { writing-mode: horizontal-tb; }
  .rv-keys { display: none; }
}

/* Client journey player (.wk-*) — specs/20260910/03-client-journey-player.md D8, amended by
   specs/20260911/06-the-client-loop.md D18-D22 (design/client-mocks/index.html and walk.html,
   approved by JJ at the look stop 2026-09-11, are the binding reference this register ports),
   chrome rule in spec/doctrine/design.md § Design Canon. Two pages: the index (one bounded card
   per journey, a fixed four-slot thumbnail rail as its hero) and the player (a step indicator in
   the top bar, a framed stage, the current screen's own requests in the side panel). The reader
   is the client, not the session, so the base size is 15px and the controls are full size. Every
   color is an existing --v-* role — no new token, no literal. The mock inside the frame/thumbnail
   iframes keeps its own document: nothing here reaches into it.

   Hierarchy, in order: the gray mocks (thumbnails on the index, the framed screen on the walk)
   are the focus; one filled control per surface says what to do next; everything the client
   wrote or we owe them is a hairline log; chrome is quiet. Muted text is 14px, body is 15px. */
.wk [hidden] { display: none !important; }
.wk { --wk-bar: 56px; --wk-side: 380px; --wk-card-r: calc(var(--v-radius) + 4px); font-size: 15px; line-height: 1.5; min-height: 100vh; margin: 0; display: flex; flex-direction: column; background: var(--v-bg); }
.wk a { color: inherit; }
.wk button { font: inherit; color: var(--v-fg); background: var(--v-bg); border: 1px solid var(--v-border); border-radius: var(--v-radius); padding: 7px 14px; cursor: pointer; line-height: 1.5; }
.wk button:hover { background: var(--v-muted-bg); }
.wk button[disabled] { opacity: .45; cursor: not-allowed; }
.wk button[disabled]:hover { background: var(--v-bg); }
.wk button:focus-visible, .wk a:focus-visible, .wk textarea:focus-visible, .wk summary:focus-visible { outline: 2px solid var(--v-ring); outline-offset: 2px; }
.wk textarea { width: 100%; font: inherit; color: var(--v-fg); background: var(--v-bg); border: 1px solid var(--v-border); border-radius: var(--v-radius); padding: 8px 10px; resize: vertical; min-height: 44px; }
.wk textarea::placeholder { color: var(--v-muted); }
.wk-lead { margin: 0 0 var(--v-space-4); color: var(--v-muted); max-width: 52ch; }
/* the one filled control per surface: the card's go action when it is the client's turn, the
   bar's Next/Confirm, the composer's Send */
.wk .wk-j-cta-primary, .wk [data-wk-role="nav"], .wk .wk-ask-form button[type="submit"] { background: var(--v-primary); color: var(--v-primary-fg); border-color: var(--v-primary); font-weight: 500; }
.wk .wk-j-cta-primary:hover, .wk [data-wk-role="nav"]:hover:not([disabled]), .wk .wk-ask-form button[type="submit"]:hover { background: color-mix(in srgb, var(--v-primary) 88%, var(--v-bg)); }
.wk [data-wk-role="nav"][disabled]:hover { background: var(--v-primary); }
/* labels arrive as kebab file names until the builder humanises them (see the implementation
   notes): a capital first letter is the one thing CSS can do about it */
.wk-title::first-letter, .wk-j-title::first-letter, .wk-thumb-cap::first-letter, .wk-caption-h::first-letter, .wk-home strong::first-letter { text-transform: uppercase; }

/* ---- index: the journey cards — the product itself, one bounded surface per journey ---- */
.wk-index-main { width: 100%; max-width: 1180px; margin: 0 auto; padding: var(--v-space-6) clamp(16px, 3vw, 40px) 20vh; }
.wk-index-head { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--v-space-6); flex-wrap: wrap; margin-bottom: var(--v-space-6); }
.wk-title { margin: 0 0 4px; font-size: 26px; font-weight: 600; letter-spacing: -.01em; }
.wk-index-head .wk-lead { margin: 0; }
.wk-progress { margin: 0; color: var(--v-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.wk-theme { display: inline-block; margin-bottom: var(--v-space-4); }

/* The rail is a fixed four-slot object: --wk-tw is the thumbnail width, fixed per breakpoint and
   never flexed, so every card shares one silhouette however many screens the journey has. Fewer
   than four screens leave quiet empty slots on the right; more than four show the first three
   and a "+N more" tile in the fourth slot. */
.wk-journeys { --wk-tw: 112px; --wk-th: 74px; --wk-rail: calc(var(--wk-tw) * 4 + var(--v-space-2) * 3);
  --wk-thumb-vw: 1280px; --wk-thumb-vh: 800px;
  list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--v-space-4); }
.wk-journey { display: grid; grid-template-columns: var(--wk-rail) minmax(0, 1fr) 150px; gap: var(--v-space-6); align-items: center;
  padding: var(--v-space-4) var(--v-space-6) var(--v-space-4) var(--v-space-4); text-decoration: none; color: inherit;
  background: var(--v-bg); border: 1px solid var(--v-border); border-radius: var(--wk-card-r); box-shadow: var(--v-shadow); }
.wk-journey:hover { border-color: var(--v-ring); }
.wk-journey[data-state="unseen"] { box-shadow: none; background: color-mix(in srgb, var(--v-muted-bg) 50%, var(--v-bg)); }
.wk-j-text { min-width: 0; }
.wk-j-title { margin: 0 0 2px; font-size: 19px; font-weight: 600; letter-spacing: -.005em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* the title is a heading that happens to be clickable: no underline at rest, an underline on
   hover/focus is its affordance; the action is a button — never underlined, ever */
.wk-j-title a { text-decoration: none; color: inherit; border-radius: 4px; }
.wk-j-title a:hover, .wk-j-title a:focus-visible { text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1.5px; }
.wk-j-title a:focus-visible { outline: 2px solid var(--v-ring); outline-offset: 2px; }
/* name, path-or-sentence, state: the path is one line; the client's own sentence may take two */
.wk-j-desc { margin: 0; color: var(--v-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wk-j-said { margin: 0; padding-left: var(--v-space-3); border-left: 2px solid var(--v-ok); color: var(--v-fg);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.wk-j-state { margin: var(--v-space-2) 0 0; display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--v-fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wk-j-state::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--v-border); flex: none; }
.wk-journey[data-state="walking"] .wk-j-state::before { background: var(--v-fg); }
.wk-journey[data-state="changes-requested"] .wk-j-state::before { background: var(--v-warn); }
.wk-journey[data-state="fixed"] .wk-j-state::before, .wk-journey[data-state="ok"] .wk-j-state::before { background: var(--v-ok); }
.wk-journey[data-state="unseen"] .wk-j-state, .wk-journey[data-state="waived"] .wk-j-state { color: var(--v-muted); }
.wk .wk-j-cta { display: block; text-align: center; text-decoration: none; border: 1px solid var(--v-border); border-radius: var(--v-radius); padding: 7px 14px; white-space: nowrap; color: var(--v-fg); background: var(--v-bg); }
.wk .wk-j-cta:hover { background: var(--v-muted-bg); text-decoration: none; }
.wk .wk-j-cta:focus-visible { outline: 2px solid var(--v-ring); outline-offset: 2px; }
.wk .wk-j-cta[data-primary="true"] { background: var(--v-primary); color: var(--v-primary-fg); border-color: var(--v-primary); font-weight: 500; }
.wk .wk-j-cta[data-primary="true"]:hover { background: color-mix(in srgb, var(--v-primary) 88%, var(--v-bg)); }

/* the strip of screen thumbnails — the journey, read left to right; the last screen the client
   reached carries the one ring, a screen with an open/fixed request carries a dot */
.wk-slots { display: flex; gap: var(--v-space-2); padding: 0; margin: 0; list-style: none; width: var(--wk-rail); }
/* document order is the render order: thumbnail, then its caption beneath */
.wk-slot { width: var(--wk-tw); flex: none; display: flex; flex-direction: column; min-height: calc(var(--wk-th) + 22px); }
.wk-thumb { position: relative; display: block; height: var(--wk-th); border: 1px solid var(--v-border); border-radius: 4px; background: var(--v-bg); overflow: hidden; }
.wk-thumb[data-current="true"] { outline: 2px solid var(--v-primary); outline-offset: 1px; }
/* the tile holds a real desktop render of the mock, scaled down to the tile's own width — never
   a fragment: --wk-thumb-vw/--wk-thumb-vh are the fixed viewport the mock renders at, the scale
   is the tile width over that viewport, and .wk-thumb's own overflow crops the bottom */
.wk-thumb-frame { width: var(--wk-thumb-vw); height: var(--wk-thumb-vh); border: 0; display: block;
  pointer-events: none; transform-origin: 0 0; transform: scale(calc(var(--wk-tw) / var(--wk-thumb-vw))); }
.wk-thumb[data-dot="warn"]::after, .wk-thumb[data-dot="ok"]::after { content: ""; position: absolute; top: 5px; right: 5px; width: 8px; height: 8px; border-radius: 50%; box-shadow: 0 0 0 2px var(--v-bg); }
.wk-thumb[data-dot="warn"]::after { background: var(--v-warn); }
.wk-thumb[data-dot="ok"]::after { background: var(--v-ok); }
.wk-thumb-cap { display: block; margin: 4px 0 0; font-size: 12px; color: var(--v-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wk-thumb[data-current="true"] + .wk-thumb-cap { color: var(--v-fg); font-weight: 500; }
.wk .wk-more { display: grid; place-items: center; height: var(--wk-th); background: var(--v-muted-bg); color: var(--v-muted); font-size: 14px; font-weight: 500; text-decoration: none; border-radius: 4px; border: 1px solid var(--v-border); }
.wk .wk-more:hover { color: var(--v-fg); background: var(--v-bg); }

@media (max-width: 1180px) {
  .wk-journeys { --wk-tw: 88px; --wk-th: 58px; }
  .wk-journey { gap: var(--v-space-4); grid-template-columns: var(--wk-rail) minmax(0, 1fr) 130px; }
}
@media (max-width: 860px) {
  .wk-journey { grid-template-columns: var(--wk-rail) minmax(0, 1fr); }
  .wk .wk-j-cta { grid-column: 2; justify-self: start; width: 150px; }
}
@media (max-width: 700px) {
  .wk-index-main { padding: var(--v-space-4) var(--v-space-4) 12vh; }
  .wk-journeys { --wk-tw: 76px; --wk-th: 50px; }
  .wk-journey { grid-template-columns: minmax(0, 1fr); padding: var(--v-space-4); gap: var(--v-space-3); }
  .wk-thumb-cap { font-size: 11px; }
  .wk .wk-j-cta { grid-column: 1; width: auto; justify-self: stretch; }
}

/* ---- composer: one line until it is needed ---- */
.wk-ask { margin-top: var(--v-space-6); border-top: 1px solid var(--v-border); padding-top: var(--v-space-4); }
.wk-ask-summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: var(--v-space-3); color: var(--v-muted); }
.wk-ask-summary::-webkit-details-marker { display: none; }
.wk-ask-summary b { color: var(--v-fg); font-weight: 500; }
.wk-ask-plus { width: 22px; height: 22px; border: 1px solid var(--v-border); border-radius: 50%; display: grid; place-items: center; font-size: 16px; line-height: 1; color: var(--v-fg); flex: none; }
.wk-ask[open] .wk-ask-plus { transform: rotate(45deg); }
.wk-ask-form { margin: var(--v-space-3) 0 0 calc(22px + var(--v-space-3)); display: grid; gap: var(--v-space-3); max-width: 60ch; justify-items: start; }
.wk-ask-in { min-height: 72px; }
.wk-ask-chips { display: flex; gap: var(--v-space-2); flex-wrap: wrap; }
.wk .wk-ask-chip { border-radius: 999px; background: var(--v-muted-bg); color: var(--v-muted); padding: 4px var(--v-space-3); font-size: 14px; border-color: transparent; }
.wk .wk-ask-chip:hover { color: var(--v-fg); }
.wk .wk-ask-chip[aria-pressed="true"] { background: var(--v-primary); color: var(--v-primary-fg); }

/* ---- requests: a log, so hairlines — open/addressed visible, resolved behind the toggle ----
   One row: the request, its actions on the right; beneath it one muted line saying where it
   is and where it stands. The left rule is the one status colour: amber we owe you, green it is
   your turn, gray closed. */
.wk-reqs { margin-top: var(--v-space-6); }
.wk-reqs-h { display: flex; align-items: baseline; gap: var(--v-space-4); margin: 0 0 var(--v-space-2); }
.wk-reqs-title { margin: 0; font-size: 15px; font-weight: 600; }
.wk-reqs-n { color: var(--v-muted); font-size: 14px; }
.wk .wk-reqs-toggle { margin-left: auto; font-size: 14px; border-color: transparent; background: transparent; color: var(--v-muted); padding: 4px 8px; }
.wk .wk-reqs-toggle:hover { color: var(--v-fg); background: var(--v-muted-bg); }
.wk-req { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; column-gap: var(--v-space-2); row-gap: var(--v-space-1); align-items: start;
  border-top: 1px solid var(--v-border); border-left: 2px solid var(--v-border); padding: var(--v-space-3) 0 var(--v-space-3) var(--v-space-3); }
.wk-req:last-of-type { border-bottom: 1px solid var(--v-border); }
.wk-req[data-status="open"] { border-left-color: var(--v-warn); }
.wk-req[data-status="addressed"] { border-left-color: var(--v-ok); }
.wk-req[data-status="resolved"] { color: var(--v-muted); }
.wk-req-text { margin: 0; grid-column: 1 / 3; grid-row: 1; color: var(--v-fg); max-width: 60ch; }
.wk-req[data-status="resolved"] .wk-req-text { color: var(--v-muted); }
.wk-req-where { grid-column: 1; grid-row: 2; color: var(--v-muted); font-size: 14px; }
.wk-req-status { margin: 0; grid-column: 2; grid-row: 2; color: var(--v-muted); font-size: 14px; }
.wk-req-where + .wk-req-status::before { content: "·"; margin-right: var(--v-space-2); }
.wk .wk-req-link { grid-column: 1 / 3; grid-row: 3; justify-self: start; font-size: 14px; color: var(--v-fg); text-underline-offset: 3px; }
.wk-req-acts { grid-column: 3; grid-row: 1 / 4; display: flex; flex-wrap: wrap; gap: var(--v-space-2); justify-content: flex-end; margin-left: var(--v-space-6); }
/* "You said: …" (20260911/06 D16): the client's reopen reason quoted back under their original
   request. Same quote shape as .wk-j-said on the index card (a 2px left rule, their words in
   --v-fg), the rule in --v-warn because this is the sentence that reopened the row; 14px so the
   original request above stays the louder line. It takes row 2 only while shown — the :has()
   shifts below move where/status/link/acts down one row, so a hidden line costs no gap. */
.wk-req-again { margin: 2px 0 0; grid-column: 1 / 3; grid-row: 2; padding-left: var(--v-space-3); border-left: 2px solid var(--v-warn); color: var(--v-fg); font-size: 14px; max-width: 60ch; }
/* specs/20260912/12-the-loop-re-anchors-and-everyone-draws.md D4, disposed s5 (2026-09-13): the
   region badge + footnote row on a client request — no rule shipped for either class before this
   pass. `.nl-region-badge`'s own rule is `position:absolute`, meant to ride a box's own corner
   (D6/D12); nested in a static list row instead it floats at the page's initial containing block,
   so this row demotes it to `static` and lays badge + text out as one flex line, the same fix
   `.nl-card-hd .nl-region-badge` above already applies for the note card's own header. */
.wk-req-outdated { margin: 2px 0 0; grid-column: 1 / 3; display: flex; align-items: center; gap: 6px; color: var(--v-muted); font-size: 14px; max-width: 60ch; }
.wk-req-outdated .nl-region-badge { position: static; box-shadow: none; }
.wk-req:has(.wk-req-again:not([hidden])) .wk-req-where { grid-row: 3; }
.wk-req:has(.wk-req-again:not([hidden])) .wk-req-status { grid-row: 3; }
.wk-req:has(.wk-req-again:not([hidden])) .wk-req-link { grid-row: 4; }
.wk-req:has(.wk-req-again:not([hidden])) .wk-req-acts { grid-row: 1 / 5; }
.wk-req[data-status="resolved"] .wk-req-acts { display: none; }
/* specs/20260912/02-an-answer-is-the-clients-until-sign-off.md D6: the one exception to the
   resolved-row hide rule above — a withdrawn request still offers "Put it back", so its own
   .wk-req-acts must survive the general rule. Selector specificity (two attribute selectors vs
   one) is what wins here, not source order alone — kept directly under the rule it overrides so
   the exception reads next to the rule it exists to defeat. */
.wk-req[data-status="resolved"][data-resolution="withdrawn"] .wk-req-acts { display: flex; }
/* the "why" box waits until "Still not right" is pressed — the script alone opens and closes it
   through the `hidden` attribute (`.wk [hidden]` above); no CSS state of its own */
.wk-req-why { flex-basis: 100%; width: 100%; min-width: 0; margin-top: var(--v-space-1); }
.wk-msg { margin: var(--v-space-2) 0 0; color: var(--v-muted); font-size: 14px; }
@media (max-width: 700px) {
  .wk-ask { margin-top: var(--v-space-4); }
  .wk-ask-form { margin-left: 0; }
  .wk-reqs { margin-top: var(--v-space-4); }
  /* narrow: where and status stack as two short lines instead of wrapping under each other */
  .wk-req { grid-template-columns: minmax(0, 1fr); }
  .wk-req-text { grid-column: 1; }
  .wk-req-where { grid-row: 2; }
  .wk-req-status { grid-column: 1; grid-row: 3; }
  .wk-req-where + .wk-req-status::before { content: none; }
  .wk .wk-req-link { grid-column: 1; grid-row: 4; }
  .wk-req-acts { grid-column: 1; grid-row: 5; justify-content: flex-start; margin-left: 0; }
  .wk-req-again { grid-column: 1; }
  .wk-req:has(.wk-req-again:not([hidden])) .wk-req-where { grid-row: 3; }
  .wk-req:has(.wk-req-again:not([hidden])) .wk-req-status { grid-row: 4; }
  .wk-req:has(.wk-req-again:not([hidden])) .wk-req-link { grid-row: 5; }
  .wk-req:has(.wk-req-again:not([hidden])) .wk-req-acts { grid-row: 6; }
}

/* ---- player bar: home · step indicator · back/next ---- */
.wk-walk { background: var(--v-muted-bg); }
.wk-bar { position: sticky; top: 0; z-index: 5; background: var(--v-bg); border-bottom: 1px solid var(--v-border);
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: var(--v-space-6);
  height: var(--wk-bar); padding: 0 var(--v-space-4); }
.wk .wk-home { grid-column: 1; text-decoration: none; color: var(--v-muted); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.wk .wk-home:hover { color: var(--v-fg); }
.wk .wk-home strong { color: var(--v-fg); font-weight: 600; display: inline-block; }
.wk-nav { grid-column: 3; display: flex; gap: var(--v-space-2); white-space: nowrap; }

/* the step indicator: reached is solid, current carries the one accent, unreached is an outline */
.wk-steps { grid-column: 2; display: flex; gap: var(--v-space-4); margin: 0; padding: 0; list-style: none; justify-content: center; min-width: 0; overflow: hidden; }
.wk .wk-step { display: inline-block; color: var(--v-muted); background: none; border: 0; padding: 6px 4px; border-radius: var(--v-radius); white-space: nowrap; }
.wk .wk-step::first-letter { text-transform: uppercase; }
.wk .wk-step:hover { background: var(--v-muted-bg); color: var(--v-fg); }
.wk .wk-step::before { content: ""; display: inline-block; vertical-align: -1px; margin-right: 8px; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--v-border); background: transparent; box-sizing: border-box; }
.wk .wk-step[data-reached="true"] { color: var(--v-fg); }
.wk .wk-step[data-reached="true"]::before { border-color: var(--v-fg); background: var(--v-fg); }
.wk .wk-step[data-current="true"] { color: var(--v-primary); font-weight: 600; }
.wk .wk-step[data-current="true"]::before { border-color: var(--v-primary); background: var(--v-primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--v-primary) 18%, transparent); }

/* ---- two zones: the stage, and this screen's panel ---- */
/* width:100% is load-bearing: .wk is a column flex container and .wk-main's auto side margins
   would otherwise shrink-wrap it */
.wk-main { flex: 1; width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) var(--wk-side); gap: var(--v-space-6); padding: var(--v-space-6); max-width: 1600px; margin: 0 auto; align-items: start; box-sizing: border-box; }
.wk-stage { min-width: 0; }
/* the screen, as an object: a caption bar it belongs to, a bounded surface, the states it can be in */
.wk-object { background: var(--v-bg); border: 1px solid var(--v-border); border-radius: var(--wk-card-r); box-shadow: var(--v-shadow); overflow: hidden; margin: 0; }
.wk-caption { display: flex; align-items: center; gap: var(--v-space-4); padding: 10px var(--v-space-4); border-bottom: 1px solid var(--v-border); background: color-mix(in srgb, var(--v-muted-bg) 60%, var(--v-bg)); }
.wk-caption-h { margin: 0; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
.wk-states { margin-left: auto; display: flex; flex-wrap: wrap; gap: 4px; }
.wk .wk-states button { font-size: 13px; padding: 3px 10px; color: var(--v-muted); border-color: transparent; background: transparent; text-transform: capitalize; }
.wk .wk-states button:hover { background: var(--v-bg); border-color: var(--v-border); color: var(--v-fg); }
.wk .wk-states button[aria-selected="true"] { background: var(--v-bg); color: var(--v-fg); border-color: var(--v-border); }
.wk-frame { min-height: 62vh; width: 100%; border: 0; display: block; background: var(--v-bg); }

/* the sign-off block: the end of the walk, in the stage above the screen so it is the first
   thing seen; the Confirm control itself is the bar's one nav button */
.wk-signoff { background: var(--v-bg); border: 1px solid var(--v-border); border-radius: var(--wk-card-r); box-shadow: var(--v-shadow);
  padding: var(--v-space-4) var(--v-space-6); margin: 0 0 var(--v-space-4); }
.wk-signoff .wk-lead { margin: 0 0 var(--v-space-2); max-width: none; color: var(--v-fg); font-weight: 500; }
.wk-sentence-in { min-height: 44px; }
.wk-sentence { margin: 0; padding-left: var(--v-space-3); border-left: 2px solid var(--v-ok); color: var(--v-fg); }

/* ---- panel: what this screen needs from the client — their requests, a note ----
   Each is one card; inside a card, rows are hairlines. */
.wk-side { display: flex; flex-direction: column; gap: 0; position: sticky; top: calc(var(--wk-bar) + var(--v-space-6)); min-width: 0; }
.wk-verdicts { display: flex; gap: var(--v-space-2); flex-wrap: wrap; }
.wk-side .wk-reqs { margin: 0 0 var(--v-space-4); background: var(--v-bg); border: 1px solid var(--v-border); border-radius: var(--wk-card-r); box-shadow: var(--v-shadow); padding: var(--v-space-2) var(--v-space-4); }
.wk-side .wk-reqs:not(:has(.wk-req:not([hidden]))) { display: none; }
.wk-side .wk-req { grid-template-columns: minmax(0, 1fr); border-top: 0; border-bottom: 1px solid var(--v-border); }
.wk-side .wk-req:last-of-type { border-bottom: 0; }
.wk-side .wk-req-text { grid-column: 1; max-width: none; }
.wk-side .wk-req-status { grid-column: 1; }
.wk-side .wk-req-acts { grid-column: 1; grid-row: 3; justify-content: flex-start; margin-left: 0; margin-top: var(--v-space-1); }
.wk-side .wk-req-again { grid-column: 1; max-width: none; }
.wk-side .wk-req:has(.wk-req-again:not([hidden])) .wk-req-status { grid-row: 3; }
.wk-side .wk-req:has(.wk-req-again:not([hidden])) .wk-req-acts { grid-row: 4; }
.wk-note { margin: 0 0 var(--v-space-4); background: var(--v-bg); border: 1px solid var(--v-border); border-radius: var(--wk-card-r); box-shadow: var(--v-shadow); padding: var(--v-space-4); display: flex; flex-direction: column; gap: var(--v-space-2); align-items: flex-start; }
.wk-note-label { display: block; width: 100%; color: var(--v-muted); font-size: 14px; }
.wk-note-in { margin-top: 6px; }
.wk-exclusions { margin: 0 0 var(--v-space-4); background: var(--v-bg); border: 1px solid var(--v-border); border-radius: var(--wk-card-r); box-shadow: var(--v-shadow); padding: var(--v-space-2) var(--v-space-4); }
.wk-exclusions:not(:has(.wk-excl)) { display: none; }
.wk-excl { padding: var(--v-space-3) 0; border-bottom: 1px solid var(--v-border); }
.wk-excl:last-child { border-bottom: 0; }
.wk-excl-claim { margin: 0 0 var(--v-space-2); }
/* the card says what it is, why each row is here, and what the client answered
   (design/client-mocks/walk.html R3/R4; specs/20260912/01 D6) */
.wk-excl-h { margin: 0 0 var(--v-space-1); font-size: 15px; font-weight: 600; }
.wk-excl-lead { margin: 0 0 var(--v-space-1); color: var(--v-muted); font-size: 14px; }
.wk-excl-from { margin: 0 0 var(--v-space-2); color: var(--v-muted); font-size: 14px; }
.wk-excl-said { margin: 0 0 var(--v-space-2); padding-left: var(--v-space-3); border-left: 2px solid var(--v-ring); color: var(--v-fg); font-size: 14px; }
.wk-excl-state { margin: 0; color: var(--v-fg); font-size: 14px; }
.wk-excl[data-verdict] .wk-verdicts { display: none; }
/* specs/20260912/02-an-answer-is-the-clients-until-sign-off.md D4/D6 (render-check fix, JJ
   2026-09-12): the binding mock (design/client-mocks/walk.html:115) renders both "way back"
   controls INLINE, inside the sentence they belong to — never as a bordered `.wk button` box on
   its own line. `.wk .wk-excl-change`/`.wk .wk-excl-put` (the extra `.wk` ancestor class, matching
   the `.wk .wk-j-cta-primary`/`.wk [data-wk-role="nav"]` pattern above) is what beats `.wk
   button`'s own (0,1,1) specificity at :421 — a bare `.wk-excl-change` selector alone is (0,1,0)
   and loses to it. Values are the mock's own (`display:inline`, `padding:0 4px`, 14px, underline,
   `text-underline-offset:3px`), translated onto this file's own --v-* tokens where one exists
   (color -> --v-fg, hover -> --v-muted-bg) rather than the mock's raw hex. */
.wk .wk-excl-change, .wk .wk-excl-put {
  display: inline; padding: 0 4px; font-size: 14px; text-decoration: underline;
  text-underline-offset: 3px; color: var(--v-fg); background: transparent; border: 0;
  border-radius: var(--v-radius); line-height: inherit;
}
.wk .wk-excl-change:hover, .wk .wk-excl-put:hover { background: var(--v-muted-bg); }
.wk-side .wk-msg { margin: 0; }

@media (max-width: 1180px) {
  .wk { --wk-side: 300px; }
  .wk-main { gap: var(--v-space-4); padding: var(--v-space-4); }
  .wk-frame { min-height: 56vh; }
}
@media (max-width: 900px) {
  .wk-main { grid-template-columns: minmax(0, 1fr); }
  .wk-side { position: static; }
  .wk-steps { gap: var(--v-space-2); }
  .wk .wk-step { padding: 6px; }
}
@media (max-width: 600px) {
  .wk-bar { grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--v-space-3); padding: 0 var(--v-space-3); }
  .wk-steps { display: none; }
  .wk .wk-arrow { padding: 7px 10px; }
  .wk-main { padding: var(--v-space-3); }
  .wk-frame { min-height: 60vh; }
  .wk-caption { flex-wrap: wrap; gap: var(--v-space-2); }
  .wk-states { margin-left: 0; width: 100%; }
  .wk-signoff { padding: var(--v-space-4); }
}
@media (prefers-reduced-motion: no-preference) {
  .wk-ask-plus { transition: transform .15s ease; }
  .wk .wk-step, .wk .wk-states button, .wk-journey { transition: background .12s ease, border-color .12s ease; }
}

/* Notes layer — area marking. specs/20260912/11-a-note-can-mark-an-area.md D4/D5/D6/D7/D8/D9,
   authored from the approved prototype design/chrome-mocks/notes.html. The overlay (a third
   .nl-host, sibling to the bar and strip) paints one .nl-region box per note whose region
   resolves on the active state; each box's color is a per-box `--c` custom property the layer
   script sets to one of the four roles below. specs/20260913/05-a-note-is-a-conversation.md D1/D5
   replaced the three status-named roles with turnOf's turn register — the register is
   --v-danger session, --v-warn you, --v-ok done, --v-muted outdated — because a note's colour is
   now whose turn it is, not its raw status (a `resolved`+`waived` note is `done` like any other,
   never a role of its own). The glyph a role paints keeps its pre-existing class name for the
   same shape (session→open, you→addressed, done→resolved, outdated→outdated), so
   `lib/walk-page.js`'s client rows — which still emit those literal status classes — render
   identically without a second rule set here. A glyph distinguishes turn by shape as well as
   color (a11y): hollow ring (session), half-filled ring (you), filled dot (done), dashed ring
   (outdated). No rule here targets the served mock's own document — this file is linked only
   inside the layer's shadow roots (the isolation invariant,
   tests/mocks/notes-layer-isolation.test.js). */
.nl-overlay { position: absolute; inset: 0; }
/* specs/20260913/02-the-layer-owns-one-mode-and-the-page-owns-the-card.md D5: affordances derive
   from the overlay's own `data-mode` — the layer's only writer is `setMode`, and the imperative
   `setStyle(overlayHost, {pointerEvents, cursor})` calls it used to make are deleted with this
   rule. `idle`/`composing` are inert (a card open takes no drag); `arming`/`drawing` turn on
   pointer-events, the crosshair and touch-action:none together, plus the 6%-ink scrim
   `design/chrome-mocks/notes.html` declares as `.device.marking .nl-overlay::before` — restated
   here as `color-mix(in srgb, var(--v-fg) 6%, transparent)` rather than the prototype's literal
   `rgba(10,10,10,.06)`, since this stylesheet never carries a literal color. */
.nl-overlay[data-mode="idle"],
.nl-overlay[data-mode="composing"] { pointer-events: none; }
.nl-overlay[data-mode="arming"],
.nl-overlay[data-mode="drawing"] { pointer-events: auto; cursor: crosshair; touch-action: none; }
.nl-overlay[data-mode="arming"]::before,
.nl-overlay[data-mode="drawing"]::before {
  content: "";
  position: absolute;
  inset: 0;
  background: color-mix(in srgb, var(--v-fg) 6%, transparent);
}
/* D10: the view-state dim the prototype declares (`.nl-overlay.has-sel .nl-region:not(.sel)`)
   but the shipped stylesheet never carried — the layer set `has-sel` on the overlay with nothing
   here to answer it, so the treatment has never rendered until now. */
.nl-overlay.has-sel .nl-region:not(.sel) { opacity: .45; }
/* specs/20260912/12-the-loop-re-anchors-and-everyone-draws.md D12: a mark is two parts — a
   stroke-less highlighter tint over exactly the dragged area, and a dashed frame held 6px
   OUTSIDE that tint (::before) so a gutter of untouched design always separates the annotation
   from what it surrounds. The first cut's thin solid border read as a second card edge wherever
   it landed on a bordered element (the nesting defect the owner caught) — a tint has no stroke of
   its own, so it cannot nest inside anything, and a dashed warn rule 6px outside the content
   exists nowhere else in this register, so the frame has no lookalike on any mock it is painted
   over. Selection changes weight inside that register (heavier tint, full-strength 2px frame),
   never back out to a solid edge. */
.nl-region {
  position: absolute;
  border: 0;
  background: color-mix(in srgb, var(--c) 8%, transparent);
  border-radius: 2px;
  cursor: pointer;
  transition: opacity .15s, box-shadow .15s, left .25s, top .25s, width .25s, height .25s;
}
.nl-region::before {
  content: "";
  position: absolute;
  inset: -6px;
  border: 1.5px dashed color-mix(in srgb, var(--c) 65%, var(--v-bg));
  border-radius: 5px;
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--v-bg) 55%, transparent);
  pointer-events: none;
}
.nl-region:hover { box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 18%, transparent); }
.nl-region:focus-visible { outline: 2px solid var(--v-ring); outline-offset: 2px; }
.nl-region.sel { background: color-mix(in srgb, var(--c) 17%, transparent); }
.nl-region.sel::before {
  border-width: 2px;
  border-color: var(--c);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 26%, transparent);
}
/* specs/20260913/02-the-layer-owns-one-mode-and-the-page-owns-the-card.md D11: the reveal
   animation the prototype declares (`design/chrome-mocks/notes.html`'s `pulse` keyframes) but
   the shipped stylesheet never carried — `__nlSelect`'s reveal path has added the `.pulse` class
   since it shipped, with no rule here to answer it. Guarded so a reduced-motion viewer sees the
   selection state change with no animation at all. */
@media (prefers-reduced-motion: no-preference) {
  .nl-region.pulse { animation: pulse .7s ease-out 1; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--c) 50%, transparent); }
    100% { box-shadow: 0 0 0 16px transparent; }
  }
}

.nl-region-badge {
  position: absolute;
  left: -1.5px;
  top: -11px;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 20px;
  padding: 0 8px 0 6px;
  border-radius: 999px;
  background: var(--c);
  color: var(--v-primary-fg);
  font: 600 11.5px/1 var(--v-font);
  letter-spacing: .02em;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  box-shadow: 0 0 0 2px var(--v-bg), var(--v-shadow);
}
.nl-region-glyph {
  display: inline-block;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  border: 1.5px solid var(--v-primary-fg);
  box-sizing: border-box;
  font-size: 0;
}
.nl-region-glyph.open { background: transparent; }
.nl-region-glyph.addressed { background: linear-gradient(90deg, var(--v-primary-fg) 50%, transparent 50%); }
.nl-region-glyph.resolved { background: var(--v-primary-fg); }
.nl-region-glyph.outdated, .nl-region-glyph.withdrawn { border-style: dashed; }

/* specs/20260912/12-the-loop-re-anchors-and-everyone-draws.md D6: the atlas index card's derived
   open/needs-you count — muted text behind one status dot, amber when data-needs is non-zero,
   else red. This class is emitted by design-atlas.js's index render, never inside the notes
   layer's own shadow roots, so it lives here rather than beside the layer's other rules above. */
.nl-card-count { display: flex; align-items: center; gap: .45em; margin-top: .3rem; color: var(--v-muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.nl-card-count::before { content: ""; width: 7px; height: 7px; border-radius: 99px; flex: none; background: var(--v-danger); }
.nl-card-count[data-needs]:not([data-needs="0"])::before { background: var(--v-warn); }

.nl-draft {
  position: absolute;
  border: 1.5px solid var(--v-primary);
  border-radius: 6px;
  box-shadow: 0 0 0 9999px color-mix(in srgb, var(--v-fg) 28%, transparent);
}
.nl-draft-size {
  position: absolute;
  right: 0;
  bottom: -24px;
  font: 500 11.5px var(--v-font);
  color: var(--v-primary-fg);
  background: var(--v-primary);
  padding: 3px 7px;
  border-radius: 5px;
  font-variant-numeric: tabular-nums;
}

/* Card (.nl-card) — mounted inside the overlay host, positioned beside its box by the layer
   script (left/top set inline); the phone breakpoint below turns it into a bottom sheet. */
.nl-card {
  position: absolute;
  z-index: 40;
  width: 328px;
  background: var(--v-bg);
  color: var(--v-fg);
  border: 1px solid var(--v-border);
  border-radius: 12px;
  box-shadow: var(--v-shadow);
  font-size: 14px;
}
.nl-card-hd {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--v-muted);
  font-size: 12.5px;
  padding: 10px 12px;
  border-bottom: 1px solid var(--v-border);
  background: var(--v-muted-bg);
  border-radius: 12px 12px 0 0;
}
.nl-card-hd .nl-region-badge { position: static; box-shadow: none; }
.nl-card-outdated {
  margin: 12px 14px 0;
  padding: 8px 10px;
  border-radius: 8px;
  background: var(--v-muted-bg);
  color: var(--v-muted);
  font-size: 13px;
  line-height: 1.4;
}
.nl-card-thread { display: grid; gap: 12px; max-height: 240px; overflow: auto; padding: 12px 14px 4px; }
.nl-card-msg { display: grid; gap: 3px; line-height: 1.45; }
.nl-card-msg small { color: var(--v-muted); font-size: 12px; display: flex; align-items: center; gap: 6px; }
.nl-card-msg small::before {
  content: "";
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--v-border);
  display: inline-block;
}
.nl-card-me { padding-left: 10px; border-left: 2px solid var(--v-border); }
.nl-card-me small::before { background: var(--v-primary); }
.nl-card textarea {
  width: calc(100% - 28px);

function __tocOnScroll(){if(__tocRaf)return;__tocRaf=requestAnimationFrame(function(){__tocRaf=null;__tocMark()})}
window.addEventListener("scroll",__tocOnScroll);
(function(){
  var scrim=document.getElementById("tocscrim");if(scrim)scrim.addEventListener("click",__tocClose);
  var tree=document.getElementById("toctree");
  if(tree)tree.addEventListener("click",function(e){
    var row=e.target.closest?e.target.closest(".tocrow"):null;
    if(row){__tocActivate(row);return}
    var head=e.target.closest?e.target.closest(".tochead"):null;
    if(head)__tocActivateHeading(head)
  });
  var search=document.getElementById("tocsearch");
  if(search){
    search.addEventListener("input",__tocApply);
    search.addEventListener("keydown",function(e){
      if(e.key==="Enter"){var first=document.querySelector(".tocrow:not([hidden])");if(first)first.click()}
    });
  }
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape")__tocClose();
    var tag=(document.activeElement&&document.activeElement.tagName)||"";
    if(e.key==="/"&&document.activeElement!==search&&tag!=="INPUT"&&tag!=="TEXTAREA"){
      e.preventDefault();if(__tocIsOverlay())__tocOpen();if(search)search.focus()
    }
  });
  __tocApply();
  __tocMark();
})();
</script><!--picks-script--><script>
(function(){
if (new URLSearchParams(location.search).has('clean')) return
var __pm = location.pathname.match(new RegExp('^/p/[^/]+'))
var __pbase = __pm ? __pm[0] : ''
function __esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function __author(){
  var a=null
  try{a=localStorage.getItem('nl-author')}catch(e){}
  if(a) return a
  var name=(window.prompt('Your name (shown on your notes)')||'').trim()||'anonymous'
  try{localStorage.setItem('nl-author',name)}catch(e){}
  return name
}
function __post(id,extra){
  var body=Object.assign({id:id,by:__author()},extra||{})
  return fetch(__pbase+'/__picks/decide',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)})
    .then(function(r){return r.json().then(function(j){return {status:r.status,body:j}}).catch(function(){return {status:r.status,body:{}}})})
    .catch(function(){return {status:0,body:{error:'open the served atlas to decide'}}})
}
function __msg(el,text){
  var prev=el.querySelector('.decide-msg'); if(prev) prev.remove()
  var d=document.createElement('div'); d.className='decide-msg'; d.textContent=text
  el.appendChild(d)
}
function __renderPick(stopEl,stop){
  var heads=stopEl.querySelectorAll('.chead')
  heads.forEach(function(h){
    var g=h.getAttribute('data-group')
    var picked=stop.decision && stop.decision.pick===g
    h.className='chead '+(picked?'picked':'rejected')
    var badge=h.querySelector('.badge')
    if(badge){badge.className='badge '+(picked?'picked':'rejected');badge.textContent=picked?'picked':'rejected'}
    var btn=h.querySelector('[data-decide=pick]')
    if(btn) btn.textContent=picked?'Picked':'Pick this instead'
  })
  if(!stopEl.querySelector('[data-decide="why"]')){
    var why=document.createElement('input'); why.name='why-'+stop.id; why.placeholder='why this one — optional'
    var save=document.createElement('button'); save.setAttribute('data-decide','why'); save.textContent='Save'
    stopEl.appendChild(why); stopEl.appendChild(save)
  }
}
function __renderApprove(stopEl,stop){
  stopEl.innerHTML = stop.decision.verdict==='approve' ? 'Approved by '+__esc(stop.decision.by) : __esc(stop.decision.note)
}
function __apply(stopEl,res){
  if(res.status===200){
    var stop=res.body
    if(stop.kind==='pick') __renderPick(stopEl,stop); else __renderApprove(stopEl,stop)
    return
  }
  if(res.status===409){ __msg(stopEl,'already picked up by the session'); return }
  if(res.status===0){ __msg(stopEl,res.body.error); return }
  __msg(stopEl,(res.body&&res.body.error)||'could not record the decision')
}
document.addEventListener('click',function(e){
  var btn=e.target.closest && e.target.closest('[data-decide]')
  if(!btn) return
  var kind=btn.getAttribute('data-decide')
  var stopEl=btn.closest('[data-id]')
  if(!stopEl) return
  var id=stopEl.getAttribute('data-id')
  if(kind==='pick'){
    __post(id,{verdict:'pick',pick:btn.getAttribute('data-group')}).then(function(res){__apply(stopEl,res)})
  } else if(kind==='why'){
    var input=stopEl.querySelector('[name="why-'+id+'"]')
    var picked=stopEl.querySelector('.chead.picked')
    __post(id,{verdict:'pick',pick:picked?picked.getAttribute('data-group'):null,note:input?input.value:''}).then(function(res){__apply(stopEl,res)})
  } else if(kind==='approve'){
    __post(id,{verdict:'approve'}).then(function(res){__apply(stopEl,res)})
  } else if(kind==='change'){
    var ta=stopEl.querySelector('textarea[name="note-'+id+'"]')
    var note=ta?ta.value.trim():''
    if(!note){ __msg(stopEl,'a change needs a note'); return }
    __post(id,{verdict:'change',note:note}).then(function(res){__apply(stopEl,res)})
  }
})
})()
</script><!--/picks-script-->
</body></html>
